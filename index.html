<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ollama Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #1e1e2e;
    color: #cdd6f4;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 10px 16px;
    background: #181825;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #313244;
  }
  header select {
    background: #313244;
    color: #cdd6f4;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 10px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .user { align-self: flex-end; background: #89b4fa; color: #1e1e2e; }
  .assistant { align-self: flex-start; background: #313244; }
  form {
    display: flex;
    padding: 12px;
    gap: 8px;
    background: #181825;
    border-top: 1px solid #313244;
  }
  textarea {
    flex: 1;
    resize: none;
    background: #313244;
    color: #cdd6f4;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
  }
  button {
    background: #89b4fa;
    color: #1e1e2e;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <strong>Ollama Chat</strong>
  <select id="model"></select>
</header>
<div id="chat"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Escribí tu mensaje..."></textarea>
  <button id="send">Enviar</button>
</form>

<script>
const OLLAMA_URL = "http://localhost:11434";
const chatEl = document.getElementById("chat");
const modelEl = document.getElementById("model");
const formEl = document.getElementById("form");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");

let history = [];
let serverAlive = true;

async function checkHeartbeat() {
  try {
    await fetch(location.origin + "/", { method: "HEAD", cache: "no-store" });
  } catch (e) {
    if (serverAlive) {
      serverAlive = false;
      sendEl.disabled = true;
      inputEl.disabled = true;
      addMessage("assistant", "❌");
    }
  }
}
setInterval(checkHeartbeat, 3000);

async function loadModels() {
  try {
    const res = await fetch(`${OLLAMA_URL}/api/tags`);
    const data = await res.json();
    modelEl.innerHTML = "";
    for (const m of data.models) {
      const opt = document.createElement("option");
      opt.value = m.name;
      opt.textContent = m.name;
      modelEl.appendChild(opt);
    }
    const preselect = new URLSearchParams(location.search).get("model");
    if (preselect && [...modelEl.options].some(o => o.value === preselect)) {
      modelEl.value = preselect;
    }
  } catch (e) {
    addMessage("assistant", "No se pudo conectar a Ollama en " + OLLAMA_URL + ". ¿Está corriendo? (systemctl status ollama)");
  }
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function sendMessage(text) {
  history.push({ role: "user", content: text });
  addMessage("user", text);
  inputEl.value = "";
  sendEl.disabled = true;

  const replyDiv = addMessage("assistant", "");
  let replyText = "";

  try {
    const res = await fetch(`${OLLAMA_URL}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: modelEl.value, messages: history, stream: true }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const chunk = JSON.parse(line);
        if (chunk.message?.content) {
          replyText += chunk.message.content;
          replyDiv.textContent = replyText;
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      }
    }
    history.push({ role: "assistant", content: replyText });
  } catch (e) {
    replyDiv.textContent = "Error: " + e.message;
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

formEl.addEventListener("submit", (e) => {
  e.preventDefault();
  if (!serverAlive) return;
  const text = inputEl.value.trim();
  if (text) sendMessage(text);
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    formEl.requestSubmit();
  }
});

loadModels();
</script>
</body>
</html>
